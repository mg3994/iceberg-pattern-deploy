<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings - Appearance</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "error-container": "#ffdad6",
                      "primary-fixed": "#e9ddff",
                      "on-background": "#1c1b1f",
                      "error": "#ba1a1a",
                      "on-tertiary-fixed": "#31111d",
                      "surface-bright": "#fdf8fd",
                      "on-error": "#ffffff",
                      "tertiary-container": "#7d5260",
                      "outline-variant": "#cbc4d2",
                      "surface-variant": "#e5e1e7",
                      "on-surface-variant": "#494551",
                      "on-primary-fixed-variant": "#4f378a",
                      "on-error-container": "#93000a",
                      "on-primary-container": "#e0d2ff",
                      "on-tertiary-container": "#ffcbda",
                      "on-primary": "#ffffff",
                      "surface-tint": "#6750a4",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed-variant": "#4a4358",
                      "on-secondary-container": "#686177",
                      "secondary-container": "#e8def9",
                      "secondary-fixed-dim": "#ccc2dc",
                      "on-tertiary-fixed-variant": "#633b48",
                      "surface-container-low": "#f7f2f8",
                      "tertiary-fixed-dim": "#eeb8c8",
                      "background": "#fdf8fd",
                      "inverse-surface": "#313034",
                      "inverse-primary": "#cfbcff",
                      "secondary": "#625b71",
                      "primary": "#4f378a",
                      "on-tertiary": "#ffffff",
                      "outline": "#7a7582",
                      "primary-container": "#6750a4",
                      "on-secondary": "#ffffff",
                      "primary-fixed-dim": "#cfbcff",
                      "tertiary": "#633b48",
                      "surface-dim": "#ddd9de",
                      "secondary-fixed": "#e8def9",
                      "on-primary-fixed": "#22005d",
                      "surface": "#fdf8fd",
                      "on-surface": "#1c1b1f",
                      "surface-container-high": "#ebe7ec",
                      "tertiary-fixed": "#ffd9e3",
                      "surface-container-highest": "#e5e1e7",
                      "on-secondary-fixed": "#1e192b",
                      "inverse-on-surface": "#f4eff5",
                      "surface-container": "#f1ecf2"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter-md": "1rem",
                      "stack-sm": "0.5rem",
                      "stack-md": "1rem",
                      "touch-target-min": "48px",
                      "margin-mobile": "1rem",
                      "stack-lg": "1.5rem"
              },
              "fontFamily": {
                      "body-md": [
                              "Inter"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Hanken Grotesk"
                      ],
                      "title-lg": [
                              "Inter"
                      ],
                      "label-sm": [
                              "Inter"
                      ],
                      "label-lg": [
                              "Inter"
                      ],
                      "headline-lg": [
                              "Hanken Grotesk"
                      ]
              },
              "fontSize": {
                      "body-md": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "letterSpacing": "0.25px",
                                      "fontWeight": "400"
                              }
                      ],
                      "body-lg": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "letterSpacing": "0.5px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "22px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "title-lg": [
                              "18px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "500"
                              }
                      ],
                      "label-sm": [
                              "11px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.5px",
                                      "fontWeight": "500"
                              }
                      ],
                      "label-lg": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "letterSpacing": "0.1px",
                                      "fontWeight": "500"
                              }
                      ],
                      "headline-lg": [
                              "28px",
                              {
                                      "lineHeight": "36px",
                                      "fontWeight": "600"
                              }
                      ]
              }
      },
          },
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex antialiased">
<!-- Navigation Rail -->
<nav class="w-24 bg-surface-container dark:bg-surface-container-low flex flex-col items-center py-6 border-r border-outline-variant/30 hidden md:flex h-screen sticky top-0 shrink-0">
<div class="mb-12">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-title-lg" data-icon="settings">settings</span>
</div>
</div>
<div class="flex flex-col gap-6 w-full px-4">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors py-2">
<div class="px-5 py-1 rounded-full mb-1 flex items-center justify-center hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="home">home</span>
</div>
<span class="text-label-sm font-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors py-2">
<div class="px-5 py-1 rounded-full mb-1 flex items-center justify-center hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="storefront">storefront</span>
</div>
<span class="text-label-sm font-label-sm">Store</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors py-2">
<div class="px-5 py-1 rounded-full mb-1 flex items-center justify-center hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="edit_note">edit_note</span>
</div>
<span class="text-label-sm font-label-sm">Drafts</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container py-2 rounded-xl scale-95 transition-transform duration-200">
<div class="px-5 py-1 rounded-full mb-1 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
</div>
<span class="text-label-sm font-label-sm">Settings</span>
</button>
</div>
</nav>
<div class="flex-1 flex h-screen overflow-hidden">
<!-- Master List Pane -->
<aside class="w-80 bg-surface border-r border-outline-variant/30 flex flex-col h-full shrink-0">
<!-- TopAppBar styled for Master -->
<header class="flex items-center px-margin-mobile w-full h-14 bg-surface dark:bg-surface-dim shrink-0">
<h1 class="text-headline-md font-headline-md text-on-surface dark:text-inverse-on-surface">Settings</h1>
</header>
<div class="flex-1 overflow-y-auto px-4 py-4 space-y-2">
<!-- Search -->
<div class="mb-6 relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full bg-surface-container-high text-on-surface rounded-full pl-10 pr-4 py-3 border-none focus:ring-2 focus:ring-primary text-body-md font-body-md placeholder:text-on-surface-variant" placeholder="Search settings" type="text"/>
</div>
<!-- List Items -->
<button class="w-full flex items-center p-4 rounded-xl hover:bg-surface-variant/50 transition-colors text-left group">
<span class="material-symbols-outlined text-on-surface-variant mr-4 group-hover:text-primary transition-colors" data-icon="person">person</span>
<div class="flex-1">
<div class="text-title-lg font-title-lg text-on-surface">General</div>
<div class="text-body-md font-body-md text-on-surface-variant">Profile, preferences</div>
</div>
</button>
<button class="w-full flex items-center p-4 rounded-xl bg-secondary-container text-on-secondary-container text-left group">
<span class="material-symbols-outlined text-primary mr-4" data-icon="palette" data-weight="fill" style="font-variation-settings: 'FILL' 1;">palette</span>
<div class="flex-1">
<div class="text-title-lg font-title-lg text-on-surface">Appearance</div>
<div class="text-body-md font-body-md text-on-surface-variant">Theme, colors</div>
</div>
</button>
<button class="w-full flex items-center p-4 rounded-xl hover:bg-surface-variant/50 transition-colors text-left group">
<span class="material-symbols-outlined text-on-surface-variant mr-4 group-hover:text-primary transition-colors" data-icon="notifications">notifications</span>
<div class="flex-1">
<div class="text-title-lg font-title-lg text-on-surface">Notifications</div>
<div class="text-body-md font-body-md text-on-surface-variant">Alerts, sounds</div>
</div>
</button>
<button class="w-full flex items-center p-4 rounded-xl hover:bg-surface-variant/50 transition-colors text-left group">
<span class="material-symbols-outlined text-on-surface-variant mr-4 group-hover:text-primary transition-colors" data-icon="lock">lock</span>
<div class="flex-1">
<div class="text-title-lg font-title-lg text-on-surface">Privacy &amp; Security</div>
<div class="text-body-md font-body-md text-on-surface-variant">Passwords, access</div>
</div>
</button>
</div>
</aside>
<!-- Detail View Pane -->
<main class="flex-1 bg-surface-container-lowest overflow-y-auto h-full">
<div class="max-w-4xl mx-auto py-12 px-8 lg:px-16">
<h2 class="text-headline-lg font-headline-lg text-on-surface mb-8">Appearance</h2>
<!-- Theme Mode (Segmented Buttons) -->
<section class="mb-12">
<h3 class="text-title-lg font-title-lg text-on-surface mb-4">Theme Mode</h3>
<div class="bg-surface-container rounded-xl p-4 shadow-sm">
<div class="flex border border-outline-variant rounded-lg overflow-hidden w-full max-w-md">
<button class="flex-1 py-3 text-center text-body-lg font-body-lg text-on-surface-variant hover:bg-surface-variant transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="light_mode">light_mode</span>
                                Light
                            </button>
<button class="flex-1 py-3 text-center text-body-lg font-body-lg bg-primary text-on-primary flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
                                Dark
                            </button>
<button class="flex-1 py-3 text-center text-body-lg font-body-lg text-on-surface-variant hover:bg-surface-variant transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="settings_suggest">settings_suggest</span>
                                System
                            </button>
</div>
</div>
</section>
<!-- Accent Color (Circular Swatches) -->
<section class="mb-12">
<h3 class="text-title-lg font-title-lg text-on-surface mb-4">Accent Color</h3>
<div class="bg-surface-container rounded-xl p-6 shadow-sm">
<div class="flex flex-wrap gap-4">
<!-- Active Swatch -->
<div class="w-12 h-12 rounded-full flex items-center justify-center cursor-pointer relative" style="background-color: #4f378a;">
<div class="absolute inset-0 rounded-full border-2 border-primary scale-110"></div>
<span class="material-symbols-outlined text-white" data-icon="check">check</span>
</div>
<!-- Inactive Swatches -->
<div class="w-12 h-12 rounded-full cursor-pointer hover:scale-105 transition-transform" style="background-color: #3b82f6;"></div>
<div class="w-12 h-12 rounded-full cursor-pointer hover:scale-105 transition-transform" style="background-color: #10b981;"></div>
<div class="w-12 h-12 rounded-full cursor-pointer hover:scale-105 transition-transform" style="background-color: #f59e0b;"></div>
<div class="w-12 h-12 rounded-full cursor-pointer hover:scale-105 transition-transform" style="background-color: #ef4444;"></div>
<div class="w-12 h-12 rounded-full cursor-pointer hover:scale-105 transition-transform" style="background-color: #ec4899;"></div>
</div>
</div>
</section>
<!-- Language (List with Checkmarks) -->
<section>
<h3 class="text-title-lg font-title-lg text-on-surface mb-4">Language</h3>
<div class="bg-surface-container rounded-xl shadow-sm overflow-hidden">
<div class="flex items-center justify-between p-4 min-h-[56px] hover:bg-surface-variant/30 cursor-pointer">
<span class="text-body-lg font-body-lg text-on-surface">English (US)</span>
<span class="material-symbols-outlined text-primary" data-icon="check">check</span>
</div>
<div class="h-[1px] bg-outline-variant/30 ml-4"></div>
<div class="flex items-center justify-between p-4 min-h-[56px] hover:bg-surface-variant/30 cursor-pointer">
<span class="text-body-lg font-body-lg text-on-surface">Spanish</span>
</div>
<div class="h-[1px] bg-outline-variant/30 ml-4"></div>
<div class="flex items-center justify-between p-4 min-h-[56px] hover:bg-surface-variant/30 cursor-pointer">
<span class="text-body-lg font-body-lg text-on-surface">French</span>
</div>
</div>
</section>
</div>
</main>
</div>
</body></html>

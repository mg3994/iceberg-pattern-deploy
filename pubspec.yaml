name: workspace
description: A workspace for apps.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.11.0 <4.0.0"

workspace:
  - apps/blogstore
  - packages/core
  - packages/infrastructure
  - packages/l10n

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  build: ^4.0.7
  build_runner: ^2.15.1
  build_web_compilers: ^4.0.0
  drift: ^2.20.0
  flutter_lints: ^6.0.0

flutter:
  generate: true

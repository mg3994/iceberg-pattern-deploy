name: workspace
description: A worksapce for apps.
publish_to: none
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ">=3.11.0 <4.0.0"

workspace:
  - apps/blogstore
  - packages/core
  - packages/infrastructure
  - packages/l10n

# Add regular dependencies here.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  build: ^4.0.7
  build_runner: ^2.15.1
  build_web_compilers: ^4.0.0
  drift: ^2.20.0
  flutter_lints: ^6.0.0



# Localization generation is configured by the workspace-level l10n.yaml.
flutter:
  generate: true